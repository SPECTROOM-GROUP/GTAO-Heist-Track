<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECTROOM GROUP | GTA Online Heist Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="app-header">
        <div class="container">
            <div class="logo-container">
                <svg class="logo-svg" viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <g fill="#0d6efd" filter="url(#glow)">
                        <circle cx="50" cy="15" r="8"/>
                        <path d="M40,25 Q50,30 60,25 L60,45 Q50,50 40,45 Z"/>
                        <circle cx="30" cy="20" r="6"/>
                        <path d="M22,28 Q30,32 38,28 L38,45 Q30,48 22,45 Z"/>
                        <circle cx="70" cy="20" r="6"/>
                        <path d="M62,28 Q70,32 78,28 L78,45 Q70,48 62,45 Z"/>
                    </g>
                </svg>
                <h1 class="logo">SPECTROOM<span class="logo-accent">GROUP</span></h1>
            </div>
            <nav class="main-nav">
                <a href="#calculator" class="nav-link active">Калькулятор</a>
                <a href="#" class="nav-link">Статистика</a>
                <a href="#" class="nav-link">Гайды</a>
            </nav>
        </div>
    </header>

    <main id="app" class="container">
        <section id="calculator" class="card">
            <div class="card-header">
                <h2>Калькулятор Ограблений</h2>
                <div class="form-group">
                    <label for="heist-select">Ограбление:</label>
                    <select id="heist-select" class="form-control">
                        <option value="cayoPerico">The Cayo Perico Heist</option>
                        <option value="diamondCasino">The Diamond Casino Heist</option>
                    </select>
                </div>
            </div>

            <div id="heist-options-container">
                <!-- Cayo Perico Options -->
                <div id="cayoPericoOptions" class="heist-options">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="cayo-primary">Основная цель:</label>
                            <select id="cayo-primary" class="form-control">
                                <option value="1100000">Tequila</option>
                                <option value="1430000">Ruby Necklace</option>
                                <option value="1595000">Bearer Bonds</option>
                                <option value="1760000">Pink Diamond</option>
                            </select>
                        </div>
                        <div class="form-group">
                             <label for="cayo-player-cut">Ваша доля (%):</label>
                             <input type="number" id="cayo-player-cut" class="form-control" value="85" min="15" max="100">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Вторичные цели:</label>
                        <div class="secondary-targets">
                             <div class="target-item"><span>Кокаин (x2)</span><input type="number" class="form-control secondary-input" data-value="220500" min="0" value="0"></div>
                             <div class="target-item"><span>Золото (x1.5)</span><input type="number" class="form-control secondary-input" data-value="332160" min="0" value="0"></div>
                             <div class="target-item"><span>Марихуана (x1.5)</span><input type="number" class="form-control secondary-input" data-value="148500" min="0" value="0"></div>
                             <div class="target-item"><span>Картины (x1.5)</span><input type="number" class="form-control secondary-input" data-value="189500" min="0" value="0"></div>
                             <div class="target-item"><span>Наличность (x1)</span><input type="number" class="form-control secondary-input" data-value="99000" min="0" value="0"></div>
                        </div>
                    </div>
                </div>

                <div id="diamondCasinoOptions" class="heist-options hidden">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="casino-primary">Основная цель:</label>
                            <select id="casino-primary" class="form-control">
                                <option value="2115000">Наличность</option>
                                <option value="2326500">Искусство</option>
                                <option value="2585000">Золото</option>
                                <option value="3619000">Бриллианты</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="casino-hacker">Хакер (доля):</label>
                            <select id="casino-hacker" class="form-control">
                                <option value="0.05">Paige Harris (5%)</option>
                                <option value="0.07">Christian Feltz (7%)</option>
                                <option value="0.09">Yohan Blair (9%)</option>
                                <option value="0.10">Avi Schwartzman (10%)</option>
                            </select>
                        </div>
                         <div class="form-group">
                            <label for="casino-players">Кол-во игроков:</label>
                             <input type="number" id="casino-players" class="form-control" value="2" min="2" max="4">
                        </div>
                    </div>
                    <div id="player-cuts-container" class="form-group"></div>
                </div>
            </div>
            
            <div id="result-container" class="result-card">
            </div>
        </section>
    </main>
    
    <script src="app.js"></script>
</body>
</html>
